plugins {
    id 'com.android.application'
}

android {
    namespace 'com.happyhouse.photo.gallery'
    compileSdk 36

    defaultConfig {
        applicationId "com.happyhouse.photo.gallery"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

def releaseApkDir = new File("H:/overman623/Release/PhotoDesk")
tasks.configureEach { task ->
    if (task.name == "assembleDebug" || task.name == "assembleRelease") {
        task.doLast {
            if (!new File("H:/").exists()) {
                return
            }
            def variantName = task.name.substring("assemble".length()).toLowerCase()
            def apkDir = layout.buildDirectory.dir("outputs/apk/${variantName}").get().asFile
            def apks = apkDir.listFiles()?.findAll { it.isFile() && it.name.endsWith(".apk") } ?: []
            if (apks.isEmpty()) {
                println "No APK found in ${apkDir}"
                return
            }
            releaseApkDir.mkdirs()
            def versionName = android.defaultConfig.versionName
            apks.each { apk ->
                def dest = new File(releaseApkDir, "PhotoDesk-${versionName}-${variantName}.apk")
                java.nio.file.Files.copy(
                        apk.toPath(),
                        dest.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING
                )
                println "APK copied to ${dest}"
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'io.coil-kt:coil:2.7.0'
}
